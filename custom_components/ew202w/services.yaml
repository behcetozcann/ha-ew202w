update_firmware:
  name: Yazılım yükle
  description: >-
    Lambaya verilen adresten yazılım yükletir. Lamba dosyayı HTTP ile kendisi indirir,
    yedek bölüme yazar ve yeniden başlar. Yalnızca doğrulanmış bir yazılım dosyasıyla kullanın.
  fields:
    device_id:
      name: Lamba kimliği
      description: Lambanın cihaz kimliği (ör. abc123lampid).
      required: true
      selector:
        text:
    url:
      name: Yazılım adresi
      description: HTTP adresi, en fazla 127 karakter (ör. http://192.168.1.11:8123/local/ew202w.bin).
      required: true
      selector:
        text:
send_raw:
  name: Ham mesaj gönder
  description: Protokol denemeleri için lambaya ham mesaj gönderir. Ne yaptığınızı bilmiyorsanız kullanmayın.
  fields:
    device_id:
      name: Lamba kimliği
      required: true
      selector:
        text:
    msg_type:
      name: Mesaj türü
      description: Ondalık mesaj numarası (ör. 5398).
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    payload_hex:
      name: Gövde (hex)
      required: false
      selector:
        text:
    frame_type:
      name: Çerçeve türü
      description: 1 = POST, 2 = Request.
      required: false
      selector:
        number:
          min: 1
          max: 2
          mode: box
